apiVersion: v1
kind: Namespace
metadata:
  name: payment-service-dev
  labels:
    app.kubernetes.io/part-of: payment-service
    environment: dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: payment-service-qa
  labels:
    app.kubernetes.io/part-of: payment-service
    environment: qa
---
apiVersion: v1
kind: Namespace
metadata:
  name: payment-service-prod
  labels:
    app.kubernetes.io/part-of: payment-service
    environment: prod
---
# DEV: Role and binding are scoped only to payment-service-dev.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-service-helm-deployer
  namespace: payment-service-dev
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-service-helm-deployer
  namespace: payment-service-dev
subjects:
  - kind: Group
    name: payment-service-dev-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: payment-service-helm-deployer
  apiGroup: rbac.authorization.k8s.io
---
