apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-spread-demo
  namespace: payment-service-dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: topology-spread-demo
  template:
    metadata:
      labels:
        app: topology-spread-demo
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: topology-spread-demo
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: topology-spread-demo
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:stable
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
